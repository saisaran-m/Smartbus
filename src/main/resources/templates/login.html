<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBus - Login</title>
    <!-- PWA & Mobile App Support -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#FF6B00">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SmartBus">
    <link rel="apple-touch-icon" href="/images/icon-192.png">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚌</text></svg>">
    <style>
        :root {
            --primary: #FF6B00;
            --primary-dark: #E55C00;
            --bg: #F8F9FA;
            --text-primary: #1A1A2E;
            --text-secondary: #6C757D;
            --border: #E9ECEF;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
            --radius: 16px;
            --radius-sm: 8px;
            --success: #28A745;
            --danger: #DC3545;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .logo-container {
            margin-bottom: 32px;
        }
        .logo-svg {
            width: 210px;
            height: auto;
        }
        .alert {
            padding: 12px;
            border-radius: var(--radius-sm);
            margin-bottom: 20px;
            font-size: 14px;
            text-align: left;
        }
        .alert-error {
            background: #FFEBEE;
            color: #C62828;
            border-left: 4px solid var(--danger);
        }
        .alert-success {
            background: #E8F5E9;
            color: #2E7D32;
            border-left: 4px solid var(--success);
        }
        .alert-info {
            background: #E3F2FD;
            color: #1565C0;
            border-left: 4px solid #1976D2;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 16px;
            outline: none;
            transition: all 0.2s;
        }
        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255,107,0,0.1);
        }
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-primary:hover {
            background: var(--primary-dark);
        }
        .btn-primary:active {
            transform: scale(0.98);
        }
        .register-link {
            margin-top: 24px;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .register-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
        .register-link a:hover {
            text-decoration: underline;
        }
        @media (max-width: 480px) {
            .login-card { padding: 30px 20px; }
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo-container">
        <svg class="logo-svg" viewBox="0 0 220 56" xmlns="http://www.w3.org/2000/svg">
            <!-- Modern Aerodynamic Long-Distance Transit Bus -->
            <g transform="translate(2, 8)">
                <!-- Shadow underneath -->
                <ellipse cx="32" cy="38" rx="27" ry="2.5" fill="#000000" opacity="0.12"/>
                
                <!-- Roof Air Conditioner (Signature interstate coach feature) -->
                <rect x="18" y="0" width="22" height="4" rx="2" fill="#D95300"/>
                
                <!-- Main Aerodynamic Coach Body -->
                <path d="M3,34 L3,10 C3,5 6,2 13,2 L48,2 C55,2 59,5 61,11 L63,24 C64,30 61,34 56,34 Z" fill="#FF6B00"/>
                
                <!-- Front Aerodynamic Windshield -->
                <path d="M50,5 L56,11 L57,19 L48,19 L48,5 Z" fill="#FFFFFF"/>
                
                <!-- 4 Distinct Passenger Windows -->
                <rect x="37" y="5" width="8.5" height="14" rx="2" fill="#FFFFFF"/>
                <rect x="26" y="5" width="8.5" height="14" rx="2" fill="#FFFFFF"/>
                <rect x="15" y="5" width="8.5" height="14" rx="2" fill="#FFFFFF"/>
                <rect x="5" y="5" width="7.5" height="14" rx="2" fill="#FFFFFF"/>

                <!-- Contrast Speed Stripe -->
                <rect x="3" y="24" width="58" height="2.5" fill="#E55C00"/>

                <!-- Rear Wheel -->
                <circle cx="15" cy="34" r="6.5" fill="#1E293B"/>
                <circle cx="15" cy="34" r="3.2" fill="#E2E8F0"/>
                <circle cx="15" cy="34" r="1.2" fill="#1E293B"/>

                <!-- Front Wheel -->
                <circle cx="49" cy="34" r="6.5" fill="#1E293B"/>
                <circle cx="49" cy="34" r="3.2" fill="#E2E8F0"/>
                <circle cx="49" cy="34" r="1.2" fill="#1E293B"/>

                <!-- Amber Front Headlight -->
                <path d="M62,23 L65,24 L62,26 Z" fill="#FBBF24"/>
            </g>

            <!-- Clean Modern Typography -->
            <text x="74" y="37" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#1A1A2E" letter-spacing="-0.5">
                Smart<tspan fill="#FF6B00">Bus</tspan>
            </text>
        </svg>
    </div>

    <div th:if="${param.error}" class="alert alert-error">
        Invalid username or password.
    </div>
    
    <div th:if="${param.logout}" class="alert alert-info">
        You have been logged out successfully.
    </div>
    
    <div th:if="${param.registered}" class="alert alert-success">
        Registration successful! Please sign in.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" class="form-input" required autofocus autocomplete="username">
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-input" required autocomplete="current-password">
        </div>
        
        <button type="submit" class="btn-primary">Sign In</button>
    </form>
    
    <div class="register-link">
        New to SmartBus? <a th:href="@{/register}">Create an account</a>
    </div>

    <div style="margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); text-align: center;">
        <a href="/downloads/SmartBus.apk" download="SmartBus.apk" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px; background: #FFF3E0; color: #E65100; border: 1.5px solid #FFB74D; border-radius: var(--radius-sm); font-weight: 600; text-decoration: none; font-size: 14px;">
            <span>📲</span> Download Android App (.apk)
        </a>
    </div>
</div>

</body>
</html>
